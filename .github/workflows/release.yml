# Builds what scripts/package.sh can't on Linux and attaches it to the
# release: the macOS app (Apple Silicon and Intel in one), the Android APK
# and the iOS app. Each needs its own toolchain, so they run on GitHub's
# machines; the Windows and Linux builds come from scripts/package.sh.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v1.0.9); empty builds master without uploading
        required: false

permissions:
  contents: write

env:
  REF: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Read the version
        env:
          DSYNC_UPDATE_PUBLIC_KEY: ${{ secrets.DSYNC_UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ] && [ -z "$DSYNC_UPDATE_PUBLIC_KEY" ]; then
            echo "DSYNC_UPDATE_PUBLIC_KEY secret is required for release builds"
            exit 1
          fi
          echo "VERSION=$(sed -n 's/.*"productVersion": *"\([^"]*\)".*/\1/p' wails.json)" >> "$GITHUB_ENV"
          if [ -n "$DSYNC_UPDATE_PUBLIC_KEY" ]; then
            echo "UPDATE_KEY_LDFLAG=-X dsync/internal/update.releasePublicKeyDERBase64=$DSYNC_UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: go test ./internal/...

      - name: Build the app
        run: wails build -platform darwin/universal -trimpath -ldflags "-s -w -X dsync/internal/version.Version=$VERSION $UPDATE_KEY_LDFLAG"

      - name: Build the command-line tool
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X dsync/internal/version.Version=$VERSION $UPDATE_KEY_LDFLAG" -o "dsync-$arch" ./cmd/dsync
          done
          lipo -create -output dsync dsync-amd64 dsync-arm64

      - name: Make the disk image
        run: |
          app=$(ls -d build/bin/*.app | head -1)
          mkdir dmg out
          cp -R "$app" dmg/dsync.app
          cp dsync dmg/dsync.app/Contents/MacOS/dsync
          # Without a Developer ID the app is signed ad hoc, which Apple
          # Silicon requires to run it at all.
          codesign --force --deep --sign - dmg/dsync.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname "dsync $VERSION" -srcfolder dmg -ov -format UDZO "out/dsync-$VERSION-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dsync-macos
          path: out/*

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install and test
        run: |
          npm ci
          npm run test:crypto
          npm run test:filename
          npm run test:network
          npm run typecheck

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DSYNC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSYNC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSYNC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Signed with dsync's key so each release installs over the last;
          # without the secrets (a fork) it's signed with a throwaway key.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export DSYNC_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          version=$(node -p "require('../../wails.json').info.productVersion")
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk "../../out/dsync-$version-android.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "../../out/dsync-$version-android.apk" | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: dsync-android
          path: out/*

  ios:
    # Expo's iOS code needs Swift 6.3 (Xcode 26.4 or later).
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Install
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios

      - name: Build the app
        run: |
          # No Apple Developer account, so the app is built unsigned; it's
          # signed when it's installed (AltStore, Sideloadly, ...).
          xcodebuild -workspace ios/dsync.xcworkspace -scheme dsync \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              # Show the failing steps' own output, not just the summary.
              grep -nE 'error|Error|FAILED|failed' "$RUNNER_TEMP/xcodebuild.log" | tail -60
              sed -n '/^PhaseScriptExecution/,/^$/p' "$RUNNER_TEMP/xcodebuild.log" | tail -150
              exit 1
            }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log

      - name: Make the .ipa
        run: |
          version=$(node -p "require('../wails.json').info.productVersion")
          mkdir -p Payload ../out
          cp -R build/Build/Products/Release-iphoneos/dsync.app Payload/
          zip -qr "../out/dsync-$version-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: dsync-ios
          path: out/*

  publish:
    needs: [macos, android, ios]
    # Attach whatever built, even if one of the builds failed.
    if: always() && (github.event_name == 'release' || inputs.tag != '')
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DSYNC_UPDATE_PUBLIC_KEY: ${{ secrets.DSYNC_UPDATE_PUBLIC_KEY }}
          DSYNC_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.DSYNC_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          [ -n "$DSYNC_UPDATE_PUBLIC_KEY" ] || { echo "DSYNC_UPDATE_PUBLIC_KEY secret is required"; exit 1; }
          [ -n "$DSYNC_UPDATE_PRIVATE_KEY_PEM" ] || { echo "DSYNC_UPDATE_PRIVATE_KEY_PEM secret is required"; exit 1; }
          key="$RUNNER_TEMP/dsync-update-key.pem"
          printf '%s\n' "$DSYNC_UPDATE_PRIVATE_KEY_PEM" > "$key"
          chmod 600 "$key"
          actual_public_key=$(openssl pkey -in "$key" -pubout -outform DER | base64 -w0)
          [ "$actual_public_key" = "$DSYNC_UPDATE_PUBLIC_KEY" ] || { echo "release signing secrets do not match"; exit 1; }
          cd out
          ls -la
          [ -n "$(ls)" ] || { echo "nothing built"; exit 1; }
          # Add them to SHA256SUMS so they can be checked like the others.
          gh release download "$TAG" --pattern SHA256SUMS --dir .. --clobber
          for f in *; do
            grep -v " $f\$" ../SHA256SUMS > ../SHA256SUMS.new || true
            sha256sum "$f" >> ../SHA256SUMS.new
            mv ../SHA256SUMS.new ../SHA256SUMS
          done
          openssl pkeyutl -sign -rawin -inkey "$key" -in ../SHA256SUMS -out ../SHA256SUMS.sig
          # Do not publish new assets until their signed metadata is ready.
          gh release upload "$TAG" * --clobber
          gh release upload "$TAG" ../SHA256SUMS ../SHA256SUMS.sig --clobber
