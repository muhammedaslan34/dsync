# Builds dsync for macOS (Apple Silicon and Intel in one app) and attaches
# the disk image to the release. macOS apps have to be built on a Mac, so
# this runs on GitHub's; the other platforms come from scripts/package.sh.
name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v1.0.8); empty builds master without uploading
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Read the version
        run: echo "VERSION=$(sed -n 's/.*"productVersion": *"\([^"]*\)".*/\1/p' wails.json)" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./internal/...

      - name: Build the app
        run: wails build -platform darwin/universal -trimpath -ldflags "-s -w -X dsync/internal/version.Version=$VERSION"

      - name: Build the command-line tool
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X dsync/internal/version.Version=$VERSION" -o "dsync-$arch" ./cmd/dsync
          done
          lipo -create -output dsync dsync-amd64 dsync-arm64

      - name: Make the disk image
        run: |
          app=$(ls -d build/bin/*.app | head -1)
          mkdir dmg
          cp -R "$app" dmg/dsync.app
          cp dsync dmg/dsync.app/Contents/MacOS/dsync
          # Without a Developer ID the app is signed ad hoc, which Apple
          # Silicon requires to run it at all.
          codesign --force --deep --sign - dmg/dsync.app
          ln -s /Applications dmg/Applications
          name="dsync-$VERSION-macos-universal.dmg"
          hdiutil create -volname "dsync $VERSION" -srcfolder dmg -ov -format UDZO "$name"
          shasum -a 256 "$name" > "$name.sha256"
          echo "DMG=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dsync-macos
          path: ${{ env.DMG }}

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" "$DMG" --clobber
          # Add the disk image to SHA256SUMS so the in-app updater can check it.
          gh release download "$TAG" --pattern SHA256SUMS --clobber
          grep -v " $DMG\$" SHA256SUMS > SHA256SUMS.new || true
          cat "$DMG.sha256" >> SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
